<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eternal Legends</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#12152b;color:#ece6d6;font:14px Georgia,'Times New Roman',serif;overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}#world{z-index:0;pointer-events:none}
.ui{position:fixed;left:0;right:0;padding:8px;pointer-events:none;z-index:2}
.ui>*{pointer-events:auto}
#hud{top:env(safe-area-inset-top,0)}
#hn{text-shadow:0 1px 3px #000;margin-bottom:2px}
.bar{height:16px;background:#0009;border:1px solid #d9a44155;border-radius:3px;overflow:hidden;margin:3px 0;position:relative}
.bar i{display:block;height:100%;width:0;transition:width .3s}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:15px;text-shadow:0 1px 2px #000}
#nav{bottom:env(safe-area-inset-bottom,0);display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
button,select,input{font:inherit;color:#ece6d6}
button{background:#2b2147;border:1px solid #d9a441;border-radius:4px;padding:10px 12px;min-height:46px}
button:active{background:#d9a441;color:#12152b}
button:disabled{opacity:.4}
#nav button{flex:1;font-size:21px;padding:6px}
#nav button.on{background:#d9a441;color:#12152b}
#panel{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0));max-height:55vh;overflow:auto;background:#12152bf2;border:1px solid #d9a441;border-radius:6px;padding:10px;z-index:3}
@media(min-width:700px){#panel{left:auto;width:420px;right:12px}}
h3{margin:0 0 8px;color:#d9a441;font-weight:normal;font-size:17px}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff18}
.row>div{flex:1;min-width:0}.row small{display:block;color:#a9a3c0}
.row button{min-height:38px;padding:6px 9px;margin-left:4px}
.big{width:100%;min-height:64px;font-size:19px;background:#8c2f1f;margin:8px 0}
#auth,#off{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#12152bf0;z-index:9;padding:16px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;background:#1b1838;border:1px solid #d9a441;border-radius:6px;padding:20px}
.card h1,.card h2{margin:0;color:#d9a441;font-weight:normal}
input,select{background:#0d0f20;border:1px solid #6d6590;border-radius:4px;padding:12px;width:100%}
#err{color:#ff8c7a;margin:0;min-height:1em}
#toast{position:fixed;top:92px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid #d9a441;padding:8px 14px;border-radius:4px;z-index:6;max-width:90%;text-align:center}
#clog{height:30vh;overflow:auto;margin-bottom:6px}#clog div{padding:2px 0}
.sys{color:#d9a441;font-style:italic}
</style></head><body>
<div id="hud" class="ui" hidden><div id="hn"></div>
<div class="bar"><i id="hb" style="background:#b8302a"></i><span id="ht"></span></div>
<div class="bar"><i id="xb" style="background:#3a74c9"></i><span id="xt"></span></div>
<div class="bar"><i id="mb" style="background:#c9822a"></i><span id="mt"></span></div></div>
<div id="toast" hidden></div><div id="panel" hidden></div>
<div id="nav" class="ui" hidden>
<button data-tab="fight">🎯</button><button data-tab="pvp">⚔️</button><button data-tab="inv">🎒</button><button data-tab="up">⬆️</button><button data-tab="magic">✨</button>
<button data-tab="boss">👑</button><button data-tab="rank">🏆</button><button data-tab="chat">💬</button></div>
<div id="off" hidden></div>
<canvas id="world" aria-label="Mundo 2D pixel art"></canvas>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n);
const RC=['#b0b0b0','#55dd55','#4c8cff','#b455ff','#ffaa22','#ff4444'];
let ws,S=null,CFG=null,tab=null,chat=[],rank=[],toastT;
let pixelStarted=false,tt=0,hero=null,mon=null,bossM=null,others=new Map(),spellFx=[],enemyFx=[],fx={heroHit:0,monHit:0,attack:0,monsterAttack:0,kill:0},lastHp=null,lastMhp=null,lastKills=0;
const clock={t:performance.now(),get(){const n=performance.now(),d=(n-this.t)/1000;this.t=n;return Math.min(d,.1)}};

// ---------- conexão ----------
function connect(tk){if(!pixelStarted)initPixel();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>ws.send(JSON.stringify({t:'auth',token:tk}));
 ws.onerror=()=>{if(world&&px){drawWorld();txt('ERRO DE CONEXAO',160,88,'#ff9a8f',10);txt('Tente atualizar a pagina',160,101,'#f3d58b',7)}};
 ws.onmessage=e=>onMsg(JSON.parse(e.data));
 ws.onclose=()=>{if(CFG){toast('Conexão perdida. Reconectando...');setTimeout(()=>location.reload(),3000)}}}
const send=m=>ws&&ws.readyState===1&&ws.send(JSON.stringify(m));
function toast(x){const t=$('#toast');t.textContent=x;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

function onMsg(m){
 if(m.t==='cfg'){CFG=m;$('#hud').hidden=false;$('#nav').hidden=false;if(!pixelStarted)initPixel()}
 else if(m.t==='s'){S=m;if(m.ev&&m.ev.skill){spellFx.push({id:m.ev.skill.id,type:m.ev.skill.type||'arcane',n:m.ev.skill.n,color:m.ev.skill.color,dmg:m.ev.skill.dmg,t:1});fx.attack=.65;fx.monHit=.45}sync();hud();if(m.act||tab==='fight'||tab==='boss'||(m.ev&&m.ev.items&&m.ev.items.length))render();if(m.ev&&m.ev.msg)toast(m.ev.msg)}
 else if(m.t==='toast')toast(m.x);
 else if(m.t==='chat'){chat.push(m);if(chat.length>80)chat.shift();addChat(m)}
 else if(m.t==='rank'){rank=m.rows;if(tab==='rank')render()}
 else if(m.t==='offline')showOff(m);
 else if(m.t==='err'){localStorage.removeItem('el_token');CFG=null;location.href='/'}}

// ---------- HUD ----------
function bar(b,t,v,max,l){$('#'+b).style.width=Math.min(100,v/max*100)+'%';$('#'+t).textContent=l+' '+fmt(v)+' / '+fmt(max)}
function hud(){const c=S.c,m=CFG.MON[c.mon];
 $('#hn').innerHTML=`<b>${esc(c.name)}</b> · ${CFG.CLASSES[c.cls].n} · Nv ${c.lvl} · 💰 ${fmt(c.gold)} · 🟢 ${S.online.length} online`;
 bar('hb','ht',c.hp,c.hpMax,'HP');bar('xb','xt',c.xp,c.xn,'XP');bar('mb','mt',c.mhp,m.hp,m.n+' Nv '+m.lv)}
function showOff(m){const s=m.sum,h=Math.floor(s.secs/3600),mi=Math.floor(s.secs%3600/60),o=$('#off');o.hidden=false;
 o.innerHTML=`<div class="card"><h2>Recompensas offline</h2><p>Você ficou fora por ${h}h ${mi}min (limite: ${m.max}h).</p>`+
 (s.risk?`<p>Seu herói parou de caçar: ${esc(s.mon)} é forte demais para ele sozinho. Escolha um monstro mais fraco ou melhore o equipamento.</p>`
 :`<p>${s.kills} ${esc(s.mon)} derrotados<br>+${fmt(s.xp)} XP · +${fmt(s.gold)} ouro · ${s.items.length} itens${s.lv?'<br>+'+s.lv+' níveis':''}</p>`)+
 `<button onclick="this.closest('#off').hidden=true">Continuar</button></div>`}

// ---------- painéis ----------
const score=i=>(i.atk*1.5+i.def+i.hp*.1)*(1+i.plus*.12);
const iName=i=>`<b style="color:${RC[i.rar]}">${CFG.RAR[i.rar]} ${CFG.SLOTS[i.slot]}${i.plus?' +'+i.plus:''}</b>`;
const iStat=i=>{const m=1+i.plus*.12;return[i.atk&&'ATK '+Math.round(i.atk*m),i.def&&'DEF '+Math.round(i.def*m),i.hp&&'HP '+Math.round(i.hp*m)].filter(Boolean).join(' · ')};
const UPN={dmg:'Dano +5%',def:'Defesa +5%',spd:'Velocidade de ataque +4%',xp:'Experiência +5%'};
function render(){const p=$('#panel');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 if(!tab||!S){p.hidden=true;return}p.hidden=false;const c=S.c;let h='';
 if(tab==='fight'){const s=c.st;
  h=`<h3>Combate</h3><button data-a="auto" data-v="${!c.auto}" style="width:100%">${c.auto?'Combate automático: LIGADO':'Combate automático: DESLIGADO'}</button>
  <p>ATK ${s.atk} · DEF ${s.def} · Vel ${s.spd}x · XP ${s.xpm}x<br>Abates: ${c.kills} · Chefes: ${c.bk}</p><h3>Onde caçar</h3>`+
  CFG.MON.map((m,i)=>`<div class="row"><div>${esc(m.n)}<small>Nv ${m.lv} · ${m.hp} HP · ${m.xp} XP</small></div><button data-a="mon" data-i="${i}" ${c.lvl<m.lv?'disabled':''}>${c.mon===i?'Caçando':c.lvl<m.lv?'Nv '+m.lv:'Ir'}</button></div>`).join('')}
 else if(tab==='inv'){
  h=`<h3>Equipado</h3>`+Object.keys(CFG.SLOTS).map(sl=>{const i=c.eq[sl];return i?`<div class="row"><div>${iName(i)}<small>${iStat(i)}</small></div><button data-a="enhance" data-id="${i.id}">+ ${fmt(i.ec)}💰</button><button data-a="unequip" data-s="${sl}">Tirar</button></div>`:`<div class="row"><div style="color:#777">${CFG.SLOTS[sl]}: vazio</div></div>`}).join('')+
  `<button data-a="autoequip" style="width:100%;margin:8px 0">Equipar melhores itens</button><h3>Mochila (${c.inv.length}/60)</h3>`+
  (c.inv.length?[...c.inv].sort((a,b)=>b.rar-a.rar||b.lv-a.lv).map(i=>{const cur=c.eq[i.slot],d=Math.round(score(i)-(cur?score(cur):0));
   return`<div class="row"><div>${iName(i)}<small>${iStat(i)} <span style="color:${d>=0?'#6c6':'#e66'}">${d>=0?'▲':'▼'}${Math.abs(d)}</span></small></div><button data-a="equip" data-id="${i.id}">Usar</button><button data-a="sell" data-id="${i.id}">${fmt(i.sv)}💰</button></div>`}).join(''):'<p>Vazia. Derrote monstros para conseguir itens.</p>')}
 else if(tab==='magic'){h=`<h3>Poderes e magias</h3><p>Desbloqueie habilidades ao subir de nível. As magias são lançadas automaticamente durante o combate.</p>`+(c.skills||[]).map(sk=>`<div class="row"><div><b style="color:${sk.color}">✦ ${esc(sk.n)}</b><small>Nível ${sk.lv} · dano x${sk.dmg}${sk.unlocked?' · DESBLOQUEADO':' · Bloqueado'}</small></div><span>${sk.unlocked?'✨':'🔒'}</span></div>`).join('')+`<p style="color:#a9a3c0">Derrote monstros para desbloquear poderes mais fortes.</p>`}
 else if(tab==='up'){h=`<h3>Melhorias</h3><p>Ouro: ${fmt(c.gold)}</p>`+Object.keys(UPN).map(k=>`<div class="row"><div>${UPN[k]}<small>Nível ${c.up[k]}/50</small></div><button data-a="up" data-s="${k}" ${c.gold<c.upc[k]||c.up[k]>=50?'disabled':''}>${fmt(c.upc[k])}💰</button></div>`).join('')}
 else if(tab==='pvp'){
  const pv=S.pvp||{}, duel=pv.duel;
  h=`<h3>Arena PvP</h3><p>Desafie outro jogador online para um duelo voluntário. O vencedor recebe ouro, XP e chance de drop de equipamento.</p>`+
  (pv.incoming?`<div class="row"><div><b>${esc(pv.incoming.n)}</b><small>Desafiou você · Nv ${pv.incoming.l}</small></div><button data-a="pvpAccept">Aceitar</button></div>`:'')+
  (duel?`<h3>Duelo contra ${esc(duel.n)}</h3><div class="bar"><i style="background:#e34e59;width:${Math.max(0,duel.hp/duel.max*100)}%"></i><span>HP adversário ${fmt(duel.hp)} / ${fmt(duel.max)}</span></div><button class="big" data-a="pvpAttack">⚔️ ATACAR</button><button data-a="pvpLeave" style="width:100%">Abandonar duelo</button>`:
  `<h3>Jogadores online</h3>`+(S.online.filter(o=>o.id!==undefined&&o.n!==c.name).length?S.online.filter(o=>o.id!==undefined&&o.n!==c.name).map(o=>`<div class="row"><div><b>${esc(o.n)}</b><small>${CFG.CLASSES[o.c].n} · Nv ${o.l}</small></div><button data-a="pvpChallenge" data-id="${o.id}">Desafiar</button></div>`).join(''):'<p>Nenhum outro jogador online agora. Convide alguém para entrar no jogo.</p>'))+
  `<p style="color:#a9a3c0">PvP não acontece sem consentimento: o jogador precisa aceitar o desafio.</p>`;
 }
 else if(tab==='boss'){const b=S.boss,B=CFG.BOSS,dead=b.hp<=0;
  h=`<h3>Chefe mundial: ${esc(B.n)}</h3><div class="bar"><i style="background:#c9a52a;width:${b.hp/b.max*100}%"></i><span>${fmt(b.hp)} / ${fmt(b.max)}</span></div>`+
  (dead?`<p>Derrotado. Renasce em ${Math.max(0,Math.ceil((b.at-Date.now())/1000))}s.</p>`:c.lvl<B.lv?`<p>Requer nível ${B.lv}.</p>`:`<button class="big" data-a="boss">Atacar chefe</button>`)+
  `<h3>Maiores danos</h3>`+(b.top.length?b.top.map((t,i)=>`<div class="row"><div>${i+1}. ${esc(t[0])}</div><div style="text-align:right">${fmt(t[1])}</div></div>`).join(''):'<p>Ninguém atacou ainda.</p>')}
 else if(tab==='rank'){h=`<h3>Ranking por nível</h3>`+(rank.length?rank.map((r,i)=>`<div class="row"><div>${i+1}. ${esc(r.n)}<small>${r.k||0} abates · ${r.b||0} chefes</small></div><div>Nv ${r.l}</div></div>`).join(''):'<p>Carregando...</p>')+
  `<h3>Online agora</h3>`+S.online.map(o=>`<div class="row"><div>${esc(o.n)}</div><div>${CFG.CLASSES[o.c].n} · Nv ${o.l}</div></div>`).join('')+`<button data-a="logout" style="width:100%;margin-top:10px">Sair da conta</button>`}
 else if(tab==='chat'){h=`<h3>Chat global</h3><div id="clog"></div><div style="display:flex;gap:6px"><input id="ci" maxlength="200" placeholder="Mensagem"><button data-a="chatsend" style="width:90px">Enviar</button></div>`}
 p.innerHTML=h;if(tab==='chat'){chat.forEach(addChat);}}
function addChat(m){const l=$('#clog');if(!l||tab!=='chat')return;const d=document.createElement('div');
 d.className=m.sys?'sys':'';d.innerHTML=m.sys?esc(m.x):`<b>${esc(m.n)}</b>: ${esc(m.x)}`;l.appendChild(d);l.scrollTop=l.scrollHeight}
$('#panel').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const d=b.dataset;
 if(d.a==='logout'){localStorage.removeItem('el_token');location.href='/';return}
 if(d.a==='chatsend'){const i=$('#ci');if(i.value.trim())send({t:'chat',x:i.value});i.value='';return}
 send({t:d.a,i:d.i===undefined?undefined:+d.i,id:d.id,s:d.s,v:d.v==='true'})};
$('#panel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci')$('#panel [data-a=chatsend]').click()});
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=tab===b.dataset.tab?null:b.dataset.tab;if(tab==='rank')send({t:'rank'});render()};

// ---------- Renderizador 2D pixel art otimizado ----------
const world=$('#world'),px=world.getContext('2d',{alpha:false});
const PW=320,PH=180;world.width=PW;world.height=PH;px.imageSmoothingEnabled=false;
const pal={dk:{armor:'#a92f36',light:'#ff6c58',dark:'#4a1e36',hair:'#d7d4db',skin:'#f1c19a',weapon:'#d9e5ef'},dw:{armor:'#4936a8',light:'#9278ff',dark:'#211d55',hair:'#dfd7ff',skin:'#eac09f',weapon:'#7deaff'},elf:{armor:'#238b68',light:'#72e6a7',dark:'#154a43',hair:'#f0d17b',skin:'#f4c8a4',weapon:'#b4f6a1'},mg:{armor:'#bd5b28',light:'#ffc15b',dark:'#572d34',hair:'#31233b',skin:'#e9b995',weapon:'#e7e8ef'},dl:{armor:'#542b72',light:'#b77cff',dark:'#281c42',hair:'#e5d5b5',skin:'#efc19d',weapon:'#ffd56b'},sm:{armor:'#2867a7',light:'#6bd7ff',dark:'#1c315e',hair:'#9a6bce',skin:'#edc3a7',weapon:'#d5a6ff'}};
function rect(x,y,w,h,c){px.fillStyle=c;px.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function txt(t,x,y,c,size){px.font=(size||7)+'px monospace';px.textAlign='center';px.fillStyle='#120f20';px.fillText(t,x+1,y+1);px.fillStyle=c||'#fff';px.fillText(t,x,y)}
function barPix(x,y,w,pct,c){rect(x-1,y-1,w+2,4,'#191327');rect(x,y,w,2,'#493449');rect(x,y,Math.max(0,Math.min(w,w*pct)),2,c)}
function drawHero(x,foot,cls,name,scale,attacking,hit){
 const p=pal[cls]||pal.dk;px.save();px.translate(Math.round(x),Math.round(foot));px.scale(scale||1,scale||1);
 const bob=attacking?Math.round(Math.sin(tt*18)*2):Math.round(Math.sin(tt*4)*1);
 rect(-8,0,16,3,'#151827');rect(-5,-19+bob,10,15,p.dark);rect(-7,-20+bob,3,12,p.light);
 rect(-5,-9+bob,4,7,'#27243a');rect(1,-9+bob,4,7,'#27243a');rect(-6,-3+bob,5,3,'#9b7a56');rect(1,-3+bob,6,3,'#9b7a56');
 rect(-8,-24+bob,16,14,'#17162b');rect(-7,-23+bob,14,12,p.armor);rect(-5,-22+bob,10,2,p.light);rect(-2,-19+bob,4,5,p.dark);rect(-6,-13+bob,12,2,p.light);rect(-10,-22+bob,4,5,p.light);rect(6,-22+bob,4,5,p.light);
 rect(-4,-30+bob,8,7,p.skin);rect(-5,-31+bob,10,3,p.dark);rect(-4,-34+bob,8,4,p.hair);rect(-3,-27+bob,2,1,'#29213a');rect(2,-27+bob,2,1,'#29213a');
 if(cls==='dk'||cls==='mg'||cls==='dl'){rect(-6,-32+bob,12,3,p.armor);rect(-7,-31+bob,3,5,p.light);rect(4,-31+bob,3,5,p.dark);rect(-2,-29+bob,5,2,'#e7c36b')}
 if(cls==='dw'||cls==='sm'){rect(-5,-34+bob,10,2,p.dark);rect(-2,-39+bob,4,6,p.armor);rect(-5,-36+bob,10,2,p.light);rect(-1,-26+bob,3,1,'#75e8ff')}
 if(cls==='elf'){rect(-4,-36+bob,3,5,p.hair);rect(2,-36+bob,3,5,p.hair);rect(-7,-31+bob,3,5,p.hair);rect(5,-31+bob,3,5,p.hair)}
 const wx=attacking?11+Math.round(Math.sin(tt*20)*3):9,wy=attacking?-22+bob:-18+bob;
 if(cls==='dw'||cls==='sm'){rect(wx-1,wy-2,3,12,p.dark);rect(wx,wy-7,2,6,p.weapon);rect(wx-2,wy-8,6,3,p.light);if(attacking){rect(wx+4,wy-7,6,3,'#b7ffff');rect(wx+8,wy-10,3,9,'#72dfff')}}
 else{rect(wx,wy,2,12,'#8b6846');rect(wx-1,wy-8,4,11,p.weapon);rect(wx-2,wy-7,6,2,p.light);rect(wx,wy-10,2,3,'#fff1b1');if(attacking){rect(wx+3,wy-5,6,2,'#fff1b1');rect(wx+7,wy-8,2,8,p.light)}}
 if(cls==='dk'||cls==='dl'){rect(-8,-18+bob,2,5,p.light);rect(6,-18+bob,2,5,p.light)}
 if(hit){rect(-11,-29+bob,3,3,'#fff4b5');rect(8,-25+bob,3,3,'#fff4b5')}
 px.restore();if(name){txt(name,x,foot-43*(scale||1),'#ffe5a1',6);barPix(x-11,foot-40*(scale||1),22,.95,'#5de078')}
}
function monsterPalette(d){const n=((d&&d.n)||'').toLowerCase();if(n.includes('lobo'))return{body:'#59637b',light:'#a8b8d4',dark:'#29334c',eye:'#ff5656'};if(n.includes('esqueleto')||n.includes('rei'))return{body:'#bfc5c8',light:'#fff0c5',dark:'#626a82',eye:'#ff454d'};if(n.includes('orc'))return{body:'#9b7b32',light:'#e7bf55',dark:'#4b462c',eye:'#ff4b3c'};if(n.includes('golem'))return{body:'#777e91',light:'#c4c9d6',dark:'#343b55',eye:'#fba53e'};return{body:'#579d45',light:'#a6e75b',dark:'#285b3d',eye:'#ff6259'}}
function drawMonster(x,foot,d,name,scale,attacking,hit,big){
 const p=monsterPalette(d),sz=(scale||1)*(big?1.65:1),bob=Math.round(Math.sin(tt*5+(big?2:0))*1.5);px.save();px.translate(Math.round(x),Math.round(foot));px.scale(sz,sz);
 rect(-10,0,20,3,'#151827');rect(-6,-6+bob,5,6,p.dark);rect(2,-6+bob,5,6,p.dark);
