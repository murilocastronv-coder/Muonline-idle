databases:
  - name: eternal-db
    plan: free
    databaseName: eternal
services:
  - type: web
    name: eternal-legends
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eternal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OFFLINE_MAX_HOURS
        value: "8"
